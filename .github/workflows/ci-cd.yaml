name: Ficcado CI/CD Pipeline

on:
  push:
    branches: [ main, fic/completeService ]
  pull_request:
    branches: [ main, fic/completeService ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Brand Check, Lint, Types, and Device Checker ─────────────────────
  brand-and-lint:
    name: Brand Check, Lint & Device Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            website/frontend/package-lock.json
            crm/ficcado_crm_app/package-lock.json

      - name: Brand Name Spelling Verification (strictly Ficcado, prefix FIC-)
        run: |
          cd website/frontend
          npm ci
          npm run check:brand

      - name: Device Checker (324 validations across 12 screen profiles)
        run: |
          cd website/frontend
          npm run check:devices

      - name: Website Typecheck & Lint
        run: |
          cd website/frontend
          npm run typecheck
          npm run lint

      - name: CRM Frontend Lint & Typecheck
        run: |
          cd crm/ficcado_crm_app
          npm ci
          npm run lint

  # ── Gate 2: Frontend Unit, Contract & Integration Tests ─────────────────────
  frontend-tests:
    name: Frontend Tests & Production Builds
    runs-on: ubuntu-latest
    needs: [brand-and-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            website/frontend/package-lock.json
            crm/ficcado_crm_app/package-lock.json

      - name: Website Frontend Test Suite (101 tests across 23 suites)
        run: |
          cd website/frontend
          npm ci
          npm test

      - name: CRM Frontend Test Suite
        run: |
          cd crm/ficcado_crm_app
          npm ci
          npm test

      - name: Build Website Production Bundle (37 routes)
        run: |
          cd website/frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_PAYMENT_URL: http://localhost:8000/api/payments

      - name: Build CRM Production Bundle (28 routes)
        run: |
          cd crm/ficcado_crm_app
          npm run build

  # ── Gate 3: All Microservice Backends & Database Migrations ───────────────────
  backend-tests:
    name: Microservices Test & Package
    runs-on: ubuntu-latest
    needs: [brand-and-lint]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis-session:
        image: redis:7.4.2-alpine
        ports:
          - 6380:6379
        options: >-
          --maxmemory-policy noeviction
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis-cache:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --maxmemory-policy allkeys-lru
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4.0.7-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test & Package Ficcado-Data (CRM Backend)
        run: |
          cd crm/backend/ficcado_crm_backend
          chmod +x mvnw
          ./mvnw clean test package
        env:
          DB_URL: jdbc:postgresql://localhost:5432/postgres
          DB_USERNAME: postgres
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_SESSION_HOST: localhost
          REDIS_SESSION_PORT: 6380
          REDIS_SESSION_PASSWORD: ""

      - name: Test & Package Ficcado-Website-Data
        run: |
          cd website/backend/ficcado_website_data
          chmod +x mvnw
          ./mvnw clean test package
        env:
          DB_URL: jdbc:postgresql://localhost:5432/postgres
          DB_USERNAME: postgres
          DB_PASSWORD: test_password

      - name: Test & Package Ficcado-Payment-Gateway-Data
        run: |
          cd payment/backend/ficcado_payment_gateway_data
          chmod +x mvnw
          ./mvnw clean test package
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: test_password
          RAZORPAY_KEY_ID: rzp_test_ficcado_demo_key
          RAZORPAY_KEY_SECRET: rzp_test_ficcado_secret_12345
          RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_12345

  # ── Gate 4: Deployment Guard ─────────────────────────────────────────────────
  deploy-gate:
    name: Production Deployment Gate
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - name: All Quality Gates Passed
        run: |
          echo "========================================================"
          echo "ALL GATES PASSED: Ready for Vercel Storefront Deployment"
          echo "========================================================"
