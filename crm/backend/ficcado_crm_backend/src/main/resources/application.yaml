server:
  port: ${PORT:8081}

spring:
  application:
    name: ficcado_crm_backend

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ficcado_data}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:arjun7945}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none              # Flyway owns 100% of DDL schema management
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway (schema migrations) ──────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    placeholders:
      seed-admin-email: ${SEED_ADMIN_EMAIL:admin@ficcado.com}
      seed-admin-password-hash: '${SEED_ADMIN_PASSWORD_HASH:$2a$10$ecOmlKKAMHPmImwe/hl/YuTP4k..3jN2UW4Yp1RRItvHwVcw4odG2}'



  # ── Mail (SMTP) ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mail_user}
    password: ${MAIL_PASSWORD:mail_pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    user:
      name: disabled   # Prevents Spring Security's auto-generated user warning

  # ── Cache & Redis (Phase 4: Storefront Catalog Caching) ─────────────────────
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 600000        # 10 minutes in ms
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

# ── Application-level config ─────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:ficcado-jwt-secret-key-32-bytes-minimum-length-for-hs256!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # Default: 24 hours

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # ── Customer Session Management (Port 6380, noeviction) ────────────────────
  session:
    redis:
      host: ${REDIS_SESSION_HOST:localhost}
      port: ${REDIS_SESSION_PORT:6380}
      password: ${REDIS_SESSION_PASSWORD:fic_redisSession_aj}
      url: ${REDIS_SESSION_URL:}
    idle-timeout-seconds: ${SESSION_IDLE_TIMEOUT:600}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:ficcado-gateway-internal-secret-2026}

  delivery:
    options:
      - id: "del-standard"
        name: "Express Surface Logistics"
        rate: 0
        delivery-time: "3–5 Business Days"
        status: "ACTIVE"
      - id: "del-priority"
        name: "Priority Air Courier"
        rate: 99
        delivery-time: "1–2 Business Days"
        status: "ACTIVE"

  # ── Cloudflare R2 Media Storage (item images) ─────────────────────────────
  # R2 exposes the S3-compatible API — no AWS account needed.
  # Leave blank locally; set via environment variables in production.
r2:
  account-id:        ${R2_ACCOUNT_ID:}
  access-key-id:     ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket-name:       ${R2_BUCKET_NAME:ficcado-media}
  public-url:        ${R2_PUBLIC_URL:https://media.ficcado.store}

# ── SpringDoc / OpenAPI ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Ficcado Inventory & Sales Management
    version: "@project.version@"
