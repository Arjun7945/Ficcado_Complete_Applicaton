spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ficcado_data}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:arjun7945}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: false

  security:
    user:
      name: disabled

app:
  jwt:
    secret: ficcado-jwt-secret-key-32-bytes-minimum-length-for-hs256!
  cors:
    allowed-origins: http://localhost:3000
  session:
    redis:
      host: ${REDIS_SESSION_HOST:localhost}
      port: ${REDIS_SESSION_PORT:6380}
      password: ${REDIS_SESSION_PASSWORD:fic_redisSession_aj}
    idle-timeout-seconds: ${SESSION_IDLE_TIMEOUT:600}
    cookie-secure: false
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:ficcado-gateway-internal-secret-2026}
  delivery:
    options:
      - id: "del-standard"
        name: "Express Surface Logistics"
        rate: 0
        delivery-time: "3–5 Business Days"
        status: "ACTIVE"
      - id: "del-priority"
        name: "Priority Air Courier"
        rate: 99
        delivery-time: "1–2 Business Days"
        status: "ACTIVE"

