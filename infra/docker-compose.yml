services:
  # ── PostgreSQL (Port 5433 on host) ──────────────────────────────────────────
  # Serves ficcado_website_data, ficcado_payment_gateway_data, and test databases.
  # Developer's existing native PostgreSQL stays on 5432 (ficcado_data).
  postgres:
    image: postgres:18.6-alpine
    container_name: ficcado-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      WEBSITE_DB_NAME: ${WEBSITE_DB_NAME:-ficcado_website_data}
      WEBSITE_DB_USER: ${WEBSITE_DB_USER:-ficcado_website_user}
      WEBSITE_DB_PASSWORD: ${WEBSITE_DB_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-ficcado_payment_gateway_data}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-ficcado_payment_user}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      TEST_CRM_DB_NAME: ${TEST_CRM_DB_NAME:-ficcado_data_test}
      TEST_WEBSITE_DB_NAME: ${TEST_WEBSITE_DB_NAME:-ficcado_website_data_test}
      TEST_PAYMENT_DB_NAME: ${TEST_PAYMENT_DB_NAME:-ficcado_payment_gateway_data_test}
      TEST_DB_USER: ${TEST_DB_USER:-ficcado_test_user}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
    volumes:
      - ficcado_postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ficcado-net

  # ── Redis Session (Port 6380 on host) ────────────────────────────────────────
  # Customer sessions only. Policy: noeviction (evictions rejected).
  redis-session:
    image: redis:7.4.2-alpine
    container_name: ficcado-redis-session
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_SESSION_PASSWORD}"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
    volumes:
      - ficcado_redis_session_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SESSION_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ficcado-net

  # ── Redis Cache (Port 6379 on host) ──────────────────────────────────────────
  # Product & storefront catalog caching. Policy: allkeys-lru.
  redis-cache:
    image: redis:7.4.2-alpine
    container_name: ficcado-redis-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_CACHE_PASSWORD}"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--maxmemory"
      - "${REDIS_CACHE_MAXMEMORY:-256mb}"
    volumes:
      - ficcado_redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ficcado-net

  # ── RabbitMQ (Ports 5672, 15672 on host) ─────────────────────────────────────
  # Event broker for async orders, notifications, and webhooks.
  rabbitmq:
    image: rabbitmq:4.0.5-management-alpine
    container_name: ficcado-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ficcado_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ficcado-net

  # ── NGINX API Gateway (Port 8000 on host) ───────────────────────────────────
  # Reverse proxy routing public traffic to host services via host.docker.internal.
  gateway:
    image: nginx:1.27.4-alpine
    container_name: ficcado-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_FILTER: ^FICCADO_
      FICCADO_DATA_UPSTREAM: ${FICCADO_DATA_UPSTREAM:-host.docker.internal:8081}
      FICCADO_WEBSITE_DATA_UPSTREAM: ${WEBSITE_DATA_UPSTREAM:-host.docker.internal:8082}
      FICCADO_PAYMENT_DATA_UPSTREAM: ${PAYMENT_DATA_UPSTREAM:-host.docker.internal:8083}
      FICCADO_GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-ficcado-gateway-internal-secret-2026}
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ficcado-net

  # ── Prometheus (Optional Profile: monitoring, Port 9090 on host) ────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ficcado-prometheus
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ficcado_prometheus_data:/prometheus
    networks:
      - ficcado-net

  # ── Grafana (Optional Profile: monitoring, Port 3002 on host) ───────────────
  grafana:
    image: grafana/grafana:11.2.2
    container_name: ficcado-grafana
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ficcado_grafana_data:/var/lib/grafana
    networks:
      - ficcado-net

volumes:
  ficcado_postgres_data:
    name: ficcado_postgres_data
  ficcado_redis_session_data:
    name: ficcado_redis_session_data
  ficcado_redis_cache_data:
    name: ficcado_redis_cache_data
  ficcado_rabbitmq_data:
    name: ficcado_rabbitmq_data
  ficcado_prometheus_data:
    name: ficcado_prometheus_data
  ficcado_grafana_data:
    name: ficcado_grafana_data

networks:
  ficcado-net:
    name: ficcado-net
    driver: bridge
