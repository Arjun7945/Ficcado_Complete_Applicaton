server:
  port: ${PORT:8083}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000ms}

spring:
  application:
    name: ficcado_payment_gateway_data
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ficcado_payment_gateway_data}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:arjun7945}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FiccadoPaymentHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_ficcado_demo_key}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_ficcado_secret_12345}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_12345}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
    connect-timeout-ms: ${RAZORPAY_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RAZORPAY_READ_TIMEOUT_MS:5000}
  ficcado-data:
    url: ${FICCADO_DATA_URL:http://localhost:8081}
    internal-secret: ${INTERNAL_API_KEY:ficcado-internal-service-secret-key-change-in-prod}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    cron: ${RECONCILIATION_CRON:0 */10 * * * *}
    batch-size: ${RECONCILIATION_BATCH_SIZE:100}
    max-transient-retries: ${RECONCILIATION_MAX_TRANSIENT_RETRIES:6}
    circuit-breaker:
      failure-threshold: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      open-duration-ms: ${CIRCUIT_BREAKER_OPEN_DURATION_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      hikaricp: true

logging:
  level:
    root: INFO
    com.aps.ficcado_payment_gateway_data: INFO
