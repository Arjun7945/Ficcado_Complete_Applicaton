server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:ficcado_payment_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  flyway:
    enabled: false

app:
  razorpay:
    key-id: rzp_test_mock_key
    key-secret: rzp_test_mock_secret
    webhook-secret: rzp_test_webhook_secret
    base-url: http://localhost:8083/mock-razorpay
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  ficcado-data:
    url: http://localhost:8081
    internal-secret: ficcado-internal-service-secret-key-change-in-prod
  reconciliation:
    enabled: false
    cron: "0 */10 * * * *"
    batch-size: 100
    max-transient-retries: 6
    circuit-breaker:
      failure-threshold: 5
      open-duration-ms: 1000
