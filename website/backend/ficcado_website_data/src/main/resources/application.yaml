server:
  port: ${PORT:8082}

spring:
  application:
    name: ficcado_website_data

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ── PostgreSQL DataSource ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ficcado_website_data}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:arjun7945}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  # ── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Mail (SMTP) ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: true

# ── Ficcado Custom Configuration ──────────────────────────────────────────────
app:
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:ficcado-gateway-internal-secret-2026}

ficcado:
  mail:
    from: ${MAIL_FROM:support@ficcado.in}
    enabled: ${MAIL_ENABLED:false}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}

# ── Actuator & Prometheus ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ficcado_website_data
