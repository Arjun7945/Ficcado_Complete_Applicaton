server:
  port: ${PORT:8082}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20000ms}

spring:
  application:
    name: ficcado_website_data

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ── PostgreSQL DataSource ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ficcado_website_data}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:arjun7945}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FiccadoWebsiteHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:0}

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  # ── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Mail (SMTP) ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: true

# ── Ficcado Custom Configuration ──────────────────────────────────────────────
app:
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:ficcado-gateway-internal-secret-2026}

ficcado:
  mail:
    from: ${MAIL_FROM:support@ficcado.in}
    enabled: ${MAIL_ENABLED:false}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}

# ── Actuator & Prometheus ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      hikaricp: true
    tags:
      application: ficcado_website_data
