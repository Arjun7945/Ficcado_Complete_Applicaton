server:
  port: 0

spring:
  application:
    name: ficcado_website_data_test

  datasource:
    url: jdbc:h2:mem:ficcado_website_data_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 2525

ficcado:
  mail:
    from: test@ficcado.in
    enabled: false
  otp:
    expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
